      <stop offset="0" stop-color="#45EBFF"/>
      <stop offset="1" stop-color="#C254FF"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0C2233"/>
