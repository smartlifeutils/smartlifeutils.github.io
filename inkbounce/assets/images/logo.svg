<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" role="img" aria-label="Ink Bounce">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45EBFF"/>
      <stop offset="1" stop-color="#C254FF"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ink line + ball motif -->
  <path d="M14 66 Q70 20 120 58" fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" filter="url(#g)"/>
  <circle cx="120" cy="58" r="10" fill="url(#ink)" filter="url(#g)"/>
  <text x="150" y="64" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="58" letter-spacing="3" fill="url(#ink)">INK BOUNCE</text>
</svg>
