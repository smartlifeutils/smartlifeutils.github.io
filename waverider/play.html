  <!-- Runs in <head>, before the body paints, so a phone jumps straight to its store
       instead of flashing this page first. Everything below still renders for desktop,
       for anything we can't identify, and with JS off. -->
  <script>
    (function (w) {
      "use strict";

      // No country code: Apple sends the visitor to their own storefront. A /us/ link
      // routes everyone through the US store first.
      var APP_STORE = "https://apps.apple.com/app/id6819839167";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.smartlife.waverider";

      /* Which store a visitor belongs in, or null when we can't tell. Exposed so it can be
         exercised with fabricated user agents instead of by following the redirect. */
      function storeFor(ua, touchPoints) {
        ua = ua || "";
        // Fire tablets report Android but have no Play Store on them.
        if (/Silk|KFAPWI|Kindle/i.test(ua)) return null;
        if (/Android/i.test(ua)) return PLAY_STORE;
        if (/iPhone|iPad|iPod/i.test(ua)) return APP_STORE;
        // iPadOS 13+ claims to be a Mac; a real Mac reports no touch points.
        if (/Macintosh/.test(ua) && touchPoints > 1) return APP_STORE;
        return null;
      }
      w.__storeFor = storeFor;

      var target;
      // ?platform=ios|android|none forces a branch, so the link can be checked from a
      // desktop without spoofing a user agent.
      var forced = (w.location.search.match(/[?&]platform=([a-z]+)/i) || [])[1];
      if (forced) {
        forced = forced.toLowerCase();
        target = forced === "ios" ? APP_STORE : forced === "android" ? PLAY_STORE : null;
      } else {
        target = storeFor(w.navigator.userAgent, w.navigator.maxTouchPoints);
      }

      if (!target) return;
      // replace(), not assign(): Back should return wherever they came from, not to this
      // page, which would just bounce them to the store again.
      w.location.replace(target);
    })(window);
  </script>

          <a class="badge" href="https://play.google.com/store/apps/details?id=com.smartlife.waverider" rel="noopener"><img src="assets/img/badges/google-play.png" width="162" height="48" alt="Get Wave Rider on Google Play" /></a>
        </div>
