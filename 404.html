  <script>
    // GitHub Pages serves this file for every missing URL on the domain.
    // Hand a visitor who was inside one app's site to that site's own 404 page.
    (function () {
      var site = location.pathname.split("/")[1];
      if (["waverider", "inkbounce", "budgetbuddy"].indexOf(site) !== -1) {
        location.replace("/" + site + "/404.html");
      }
    })();
  </script>

    }
    a { color: var(--link); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }
